name: CI/CD MinBun ERP to VPS

# Trigger workflow setiap kali ada push ke branch 'main'
on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # TAHAP 1: TESTING (Continuous Integration)
  # ==========================================
  test:
    name: 🧪 Run Tests (Vitest & Supertest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # FIX: codebase pakai pnpm (lihat pnpm-lock.yaml + pnpm-workspace.yaml).
      # Sebelumnya workflow pakai `npm ci` yang membaca package-lock.json
      # (tidak ada) → install akan download versi paket yang berbeda
      # dari local dev, menyebabkan "works on my machine" syndrome.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # cache ~/.local/share/pnpm/store berdasarkan lockfile hash

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile # strict — gagal jika lockfile out-of-sync

      - name: Run Tests
        # Pastikan Anda punya script "test": "vitest run" di package.json
        run: pnpm run test

  # ==========================================
  # TAHAP 2: DEPLOY (Continuous Deployment)
  # ==========================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: test # TAHAP INI HANYA JALAN JIKA TAHAP TEST LULUS 100%
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # VPS tidak punya pnpm → tetap pakai npm.
          # FIX utama: sebelumnya `git pull` gagal (merge conflict lokal VPS)
          # dan `npm install --frozen-lockfile` gagal (flag --frozen-lockfile
          # adalah pnpm-only, npm tidak mengenalinya). Tanpa `set -e`, error
          # ini diabaikan diam-diam → build pakai cache .next lama → route
          # baru seperti /api/link-hybrid-user tidak pernah terdeploy.
          script: |
            set -e

            # 1. Masuk ke folder proyek
            cd /var/www/minbun-erp

            # 2. Tarik kode terbaru dari GitHub
            #    Gunakan fetch + reset --hard agar selalu sync persis dengan
            #    remote. `git pull` bisa gagal jika ada perubahan lokal di VPS
            #    (merge conflict), sehingga kode baru tidak pernah terambil.
            #    File untracked seperti .env tetap aman (tidak di-reset).
            git fetch origin main
            git reset --hard origin/main

            # 3. Install dependencies (npm — tanpa --frozen-lockfile karena
            #    itu flag pnpm; npm akan menggunakan package-lock.json jika ada)
            npm install

            # 4. Bersihkan cache build lama agar route baru terdeteksi
            rm -rf .next

            # 5. Build dengan output standalone
            npm run build

            # ==========================================
            # FIX STANDALONE: Salin aset statis & .env
            # ==========================================
            cp -r public .next/standalone/
            cp -r .next/static .next/standalone/.next/
            cp .env .next/standalone/
            # ==========================================

            # 6. Pindah ke folder standalone & nyalakan ulang server
            cd .next/standalone
            pm2 restart minbun-erp || pm2 start server.js --name "minbun-erp"
            pm2 save

            # 7. Smoke test: tunggu 5 detik lalu cek /api/health
            sleep 5
            if ! curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health | grep -q "^200$"; then
              echo "⚠️  HEALTH CHECK FAILED — server mungkin tidak sehat, periksa log PM2"
              pm2 logs minbun-erp --lines 50 --nostream --raw
              exit 1
            else
              echo "✅ Health check passed — deploy sukses"
            fi
